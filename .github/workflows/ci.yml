name: SynCanvas CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:css
      - run: git diff --exit-code -- static/vendor/css/tailwind.css
      - run: python -m pytest -q
      - run: python -m compileall -q app tests tools
      - shell: pwsh
        run: Get-ChildItem static,custom_nodes -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE } }
      - run: node static/js/i18n/validate-i18n.js
      - run: python tools/check_mojibake.py --json
      - run: python tools/runtime_preflight.py --check
      - run: dotnet build launcher/SynCanvasLauncher.csproj -c Release
      - shell: pwsh
        run: ./tools/build_modular_release.ps1 -OutputDir "$env:RUNNER_TEMP/SynCanvas-Release-Audit" -SkipComponents
