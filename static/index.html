<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>AI Studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                localStorage.removeItem('modelscope_api_token');
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/vendor/css/tailwind.css?v=2026.08.01.4">
    <script src="/static/vendor/js/lucide.js?v=2026.08.01.4"></script>
    <script src="/static/js/theme.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n-core.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/common.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/studio.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/api-settings.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/canvas.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/smart-canvas.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/comfyui-settings.js?v=2026.08.01.4"></script>
    <script src="/static/js/i18n/legacy.js?v=2026.08.01.4"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.01.4">
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.08.01.4');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.3s var(--fluid-ease), background 0.3s, border-color 0.3s;
            z-index: 50;
        }

        body.sidebar-expanded .sidebar {
            width: 220px;
        }

        /* 首次加载时让侧栏平稳进入；页面 iframe 本身保持原子切换，避免旧页面闪现。 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .brand-lockup {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            overflow: hidden;
            padding-left: 8px;
            transition: width 0.3s var(--fluid-ease);
        }

        body.sidebar-expanded .brand-lockup {
            width: 190px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand-name {
            opacity: 0;
            color: var(--text);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        body.sidebar-expanded .brand-name {
            opacity: 1;
        }

        .sidebar-toggle {
            width: 44px;
            height: 36px;
            margin: -22px 0 22px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
        }

        .sidebar-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        body.sidebar-expanded .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            transition: width 0.3s var(--fluid-ease);
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        body.sidebar-expanded .nav-item {
            width: 190px;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        body.sidebar-expanded .nav-text {
            opacity: 1;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            transform: none;
            filter: none;
            transition: none;
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .side-actions {
            margin-top:auto;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只过渡 hover/激活会改的属性，避免 all 触发延迟 */
            transition: width 0.3s var(--fluid-ease), gap 0.3s var(--fluid-ease), background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        body.sidebar-expanded .side-pill {
            width: 170px;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .side-pill svg { width: 16px; height: 16px; flex:0 0 auto; }
        .side-pill-text {
            opacity:0;
            max-width:0;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            transition: opacity 0.2s, max-width 0.3s var(--fluid-ease);
        }
        body.sidebar-expanded .side-pill-text {
            opacity:1;
            max-width:120px;
        }
        /* 折叠态去除 gap，避免图标被推偏 */
        .side-pill { gap:0; }
        body.sidebar-expanded .side-pill { gap:8px; }

        @media (max-width: 640px) {
            .app-shell { flex-direction: column; }
            .sidebar,
            body.sidebar-expanded .sidebar {
                position: fixed;
                inset: auto 0 0 0;
                width: 100%;
                min-width: 0;
                height: 64px;
                padding: 6px 8px;
                flex-direction: row;
                border-right: 0;
                border-top: 1px solid var(--border);
                animation: none !important;
            }
            .brand-lockup,
            .sidebar-toggle { display: none; }
            .sidebar nav {
                display: flex;
                align-items: center;
                justify-content: space-around;
                flex: 1 1 auto;
                min-width: 0;
            }
            .nav-item,
            body.sidebar-expanded .nav-item {
                width: 42px;
                height: 42px;
                margin: 0 1px;
                padding-left: 11px;
                border-radius: 13px;
            }
            .nav-text,
            body.sidebar-expanded .nav-text,
            .side-pill-text,
            body.sidebar-expanded .side-pill-text { display: none; }
            .side-actions {
                width: auto;
                margin: 0;
                flex: 0 0 auto;
                flex-direction: row;
                gap: 2px;
            }
            .side-pill,
            body.sidebar-expanded .side-pill {
                width: 40px;
                height: 40px;
                gap: 0;
            }
            .stage {
                width: auto;
                margin: 8px 8px 72px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

    <script>
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                try { return crypto.randomUUID(); } catch (e) { }
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const CID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CID);
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const SIDEBAR_EXPANDED_KEY = 'studio_sidebar_expanded';
        const DEFAULT_ROUTE = 'zimage';
        const ROUTES = {
            'zimage': { page:'zimage' },
            'gpt-chat': { page:'gpt-chat' },
            'projects': { page:'projects' },
            'assets': { page:'assets' },
            'digital-human': { page:'digital-human' },
            'settings/api': { page:'settings', section:'api' },
            'settings/agents': { page:'settings', section:'agents' },
            'settings/comfyui': { page:'settings', section:'comfyui' },
            'settings/extensions': { page:'settings', section:'extensions' },
            'settings/node-engine': { page:'settings', section:'node-engine' }
        };
        const LEGACY_ROUTES = {
            'agents': 'settings/agents',
            'agent-skills': 'settings/agents',
            'api-settings': 'settings/api',
            'comfyui-settings': 'settings/comfyui',
            'settings': 'settings/api',
            'canvas': 'projects',
            'enhance': 'zimage',
            'klein': 'zimage',
            'online': 'zimage',
            'angle': 'zimage'
        };
        let activeRoute = DEFAULT_ROUTE;

        function setSidebarExpanded(expanded) {
            document.body.classList.toggle('sidebar-expanded', expanded);
            const btn = document.getElementById('sidebar-toggle-btn');
            if (btn) {
                btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                btn.title = expanded ? '收起侧边栏' : '展开侧边栏';
                btn.setAttribute('aria-label', expanded ? '收起侧边栏' : '展开侧边栏');
            }
            localStorage.setItem(SIDEBAR_EXPANDED_KEY, expanded ? '1' : '0');
        }

        function toggleSidebar() {
            setSidebarExpanded(!document.body.classList.contains('sidebar-expanded'));
        }

        function restoreSidebarState() {
            setSidebarExpanded(localStorage.getItem(SIDEBAR_EXPANDED_KEY) === '1');
        }

        function normalizeRoute(value) {
            let route = String(value || '').replace(/^#\/?/, '').replace(/^\/+|\/+$/g, '').toLowerCase();
            route = LEGACY_ROUTES[route] || route;
            return ROUTES[route] ? route : DEFAULT_ROUTE;
        }

        function settingsSection(route) {
            return ROUTES[route]?.section || 'api';
        }

        function syncSettingsRoute(frame, section) {
            if(!frame || !frame.src) return;
            try { frame.contentWindow?.postMessage({type:'studio-settings-route', section}, '*'); } catch(e) {}
        }

        function applyRoute(value, options = {}) {
            const route = normalizeRoute(value);
            const config = ROUTES[route];
            const id = config.page;
            activeRoute = route;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            const trigger = id === 'settings'
                ? document.querySelector('[data-route="settings"]')
                : document.querySelector(`[data-route="${id}"]`);
            if(trigger) trigger.classList.add('active');
            document.querySelectorAll('.stage > iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            if(!target) return;
            target.classList.add('active');
            const notifyRouteActive = () => {
                try { target.contentWindow?.postMessage({type:'studio-route-active', route, page:id}, '*'); } catch(error) {}
            };
            if(!target.src) {
                if(id === 'settings') target.addEventListener('load', () => syncSettingsRoute(target, config.section), {once:true});
                target.addEventListener('load', notifyRouteActive, {once:true});
                target.src = target.dataset.src;
            } else if(id === 'settings') {
                syncSettingsRoute(target, config.section);
                notifyRouteActive();
            } else {
                notifyRouteActive();
            }
            if(options.remember !== false) localStorage.setItem(ACTIVE_PAGE_KEY, route);
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
        }

        function navigateRoute(value, options = {}) {
            const route = normalizeRoute(value);
            const hash = '#' + route;
            if(window.location.hash === hash) {
                applyRoute(route);
                return;
            }
            if(options.replace) {
                history.replaceState(null, '', hash);
                applyRoute(route);
            } else {
                window.location.hash = route;
            }
        }

        function switchUI(el, id, options = {}) {
            navigateRoute(id, {replace:Boolean(options.skipRemember)});
        }

        function restoreActivePage() {
            const requested = window.location.hash ? window.location.hash.slice(1) : localStorage.getItem(ACTIVE_PAGE_KEY);
            const route = normalizeRoute(requested || DEFAULT_ROUTE);
            if(window.location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
            applyRoute(route);
            document.documentElement.classList.remove('studio-route-booting');
        }
        document.addEventListener('DOMContentLoaded', () => {
            restoreSidebarState();
            restoreActivePage();
        }, { once:true });
        window.addEventListener('hashchange', () => {
            const route = normalizeRoute(window.location.hash.slice(1));
            if(window.location.hash !== '#' + route) history.replaceState(null, '', '#' + route);
            applyRoute(route);
        });
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-agent-skills-updated'){
                document.querySelectorAll('iframe').forEach(frame => {
                    if(frame.contentWindow !== event.source){
                        try { frame.contentWindow?.postMessage(event.data, '*'); } catch(error) {}
                    }
                });
                return;
            }
            const settingsFrame = document.getElementById('frame-settings');
            if(event.source !== settingsFrame?.contentWindow) return;
            if(event.data?.type === 'studio-settings-navigate') {
                navigateRoute('settings/' + settingsSection('settings/' + event.data.section));
            }
        });

        const host = window.location.host;
        if (host) {
            const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${protocol}://${host}/ws/stats?client_id=${CID}`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'asset_library_updated') {
                    // Hidden pages remain mounted. Keep every loaded view in sync
                    // so a saved template appears without a manual refresh.
                    document.querySelectorAll('.stage > iframe[src]').forEach(iframe => {
                        try { iframe.contentWindow?.postMessage(data, '*'); } catch(error) {}
                    });
                }
            };
        }

        // --- 夜间模式 ---

        function syncThemeToFrame(iframe) {
            const theme = (window.StudioTheme || {get: () => 'light'}).get();
            try {
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*');
                }
            } catch (e) {}
        }

        function broadcastTheme(theme) {
            if (window.StudioTheme) {
                window.StudioTheme.set(theme);
            }
            document.querySelectorAll('iframe').forEach(f => syncThemeToFrame(f));
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const moon = document.getElementById('icon-moon');
            const sun = document.getElementById('icon-sun');
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        function toggleTheme() {
            const current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            broadcastTheme(current === 'dark' ? 'light' : 'dark');
        }

        function toggleLanguage() {
            if(!window.StudioI18n) return;
            window.StudioI18n.toggle();
            document.querySelectorAll('iframe').forEach(frame => syncLanguageToFrame(frame));
        }

        function syncLanguageToFrame(frame) {
            if(!window.StudioI18n) return;
            try {
                frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
            } catch(e) {}
        }

        function broadcastLanguage() {
            document.querySelectorAll('iframe').forEach(frame => {
                try {
                    frame.contentWindow?.postMessage({ type:'studio-lang', lang:window.StudioI18n.lang() }, '*');
                } catch(e) {}
            });
        }

        // listen for theme changes triggered by theme.js
        window.addEventListener('studio-theme-change', (e) => {
            updateThemeIcon(e.detail.theme);
        });

        // init icon state on load
        window.addEventListener('DOMContentLoaded', () => {
            const theme = window.StudioTheme ? window.StudioTheme.get() : 'light';
            updateThemeIcon(theme);
            if(window.StudioI18n) window.StudioI18n.apply();
            if(window.lucide) window.lucide.createIcons();
            broadcastLanguage();
        });

        // sync theme when iframe loads
        document.querySelectorAll('iframe').forEach(f => {
            f.addEventListener('load', () => {
                syncThemeToFrame(f);
                syncLanguageToFrame(f);
                if(f.id === 'frame-settings' && ROUTES[activeRoute]?.page === 'settings') {
                    syncSettingsRoute(f, settingsSection(activeRoute));
                }
            });
        });

    </script>
</body>

</html>
