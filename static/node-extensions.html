<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩展节点</title>
    <script>
        try {
            const theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
            if(theme === 'dark') document.documentElement.classList.add('theme-dark', 'studio-theme-dark');
        } catch(e) {}
    </script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.04.1"></script>
    <link rel="stylesheet" href="/static/css/node-extension-manager.css?v=2026.08.04.1">
</head>
<body>
    <main class="extension-settings">
        <header class="extension-toolbar">
            <div>
                <h1>扩展节点</h1>
                <p><code>custom_nodes/</code></p>
            </div>
            <div class="extension-actions">
                <button id="rescanBtn" type="button" class="icon-command" title="重新扫描"><i data-lucide="refresh-cw"></i><span>扫描</span></button>
                <button id="applyBtn" type="button" class="primary-command" disabled><i data-lucide="power"></i><span>应用并重启</span></button>
            </div>
        </header>

        <div id="summary" class="extension-summary" aria-live="polite"></div>
        <div id="status" class="extension-status" role="status" aria-live="polite"></div>
        <section class="extension-list-section" aria-labelledby="installedTitle">
            <div class="list-heading">
                <h2 id="installedTitle">已安装扩展</h2>
                <span id="packageCount">0</span>
            </div>
            <div id="extensionList" class="extension-list"></div>
        </section>
    </main>
    <script src="/static/js/node-extension-manager.js?v=2026.08.04.1"></script>
</body>
</html>
